---
# essential tasks should run on all nodes
- name: create devops group
  group:
    name: devops
    state: present
- name: create devops user
  user:
    name: devops_user
    comment: "Devops User"
    uid: 2001
    group: devops
- name: install htop package
  apt:
    name: htop
    state: present
    update_cache: yes
